<!DOCTYPE html>

<html>

<head>

<title>AI SOC Assistant</title>

<style>

body{

background:#111;
color:white;
font-family:Arial;
padding:30px;

}


.card{

background:#222;
padding:25px;
border-radius:10px;
max-width:800px;

}


input{

width:70%;
padding:12px;
border-radius:6px;
border:none;

}


button{

padding:12px 20px;
background:#00ff99;
border:none;
border-radius:6px;
cursor:pointer;

}


.response{

margin-top:20px;
background:#333;
padding:20px;
border-radius:10px;
white-space:pre-line;

}


a{

color:#00ff99;

}

</style>

</head>


<body>


<h1>🤖 AI SOC Chat Assistant</h1>


<div class="card">


<form method="POST">


<input 
type="text"
name="question"
placeholder="Ask your SOC assistant..."
required
>


<button>
Ask
</button>


</form>



{% if answer %}

<div class="response">

<h3>AI Response:</h3>

{{answer}}

</div>

{% endif %}



<br>

<a href="/">
⬅ Back to Dashboard
</a>


</div>


</body>

</html>
