<div class="card">

<h2>
💬 SOC Chat Assistant
</h2>


<form method="POST" action="/chat">

<input 
type="text"
name="question"
placeholder="Ask SOC Assistant..."
style="width:80%;padding:10px;"
>


<button type="submit">
Ask
</button>


</form>



{% if chat_answer %}

<h3>
AI Response:
</h3>


<pre>
{{chat_answer}}
</pre>


{% endif %}


</div>
