<!DOCTYPE html>

<html>

<head>

<title>AI SOC Assistant</title>


<style>

body{

background:#111;
color:white;
font-family:Arial;
padding:30px;

}


.card{

background:#222;
padding:25px;
border-radius:10px;

}


input{

width:75%;
padding:12px;

}


button{

padding:12px;
background:#00ff99;
border:none;
border-radius:8px;

}


pre{

background:#333;
padding:20px;
white-space:pre-wrap;

}

</style>


</head>


<body>


<h1>🤖 AI SOC Chat Assistant</h1>


<div class="card">


<form action="/chat" method="POST">


<input

type="text"

name="question"

placeholder="Ask your SOC assistant..."

required

>


<button>

Send

</button>


</form>



{% if answer %}

<h3>AI Response:</h3>

<pre>

{{answer}}

</pre>


{% endif %}



<br>

<a href="/" style="color:#00ff99">

⬅ Back Dashboard

</a>


</div>


</body>

</html>
