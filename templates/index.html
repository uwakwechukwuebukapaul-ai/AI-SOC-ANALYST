<!DOCTYPE html>
<html>
<head>
    <title>AI SOC Dashboard</title>

    <style>
        body {
            font-family: Arial;
            background: #111;
            color: white;
            padding: 30px;
        }

        .card {
            background: #222;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
        }

        .high {
            color: red;
        }

        .medium {
            color: orange;
        }

        .low {
            color: green;
        }
    </style>

</head>

<body>

<h1>🛡️ AI SOC ANALYST DASHBOARD</h1>

<div class="card">
<h2>Total Incidents</h2>
<h1>{{ total }}</h1>
</div>


<div class="card">

<h2>Risk Summary</h2>

<p class="high">
🔴 HIGH: {{ high }}
</p>

<p class="medium">
🟡 MEDIUM: {{ medium }}
</p>

<p class="low">
🟢 LOW: {{ low }}
</p>

</div>


<div class="card">

<h2>Latest Incident</h2>

<p>
Sender: {{ latest.sender }}
</p>

<p>
Subject: {{ latest.subject }}
</p>

<p>
Risk: {{ latest.risk }}
</p>

<p>
Score: {{ latest.score }}
</p>

</div>


</body>
</html>
